<div class="login-page">

  <div class="login-card">

    <h1>Recruitment Pipeline</h1>

    <p class="subtitle">
      Sign in to continue
    </p>


    <form
      [formGroup]="loginForm"
      (ngSubmit)="submit()"
    >

      <!-- Email -->
      <label>
        Email
      </label>

      <input
        type="email"
        formControlName="email"
        placeholder="you@example.com"
      />

      <small
        *ngIf="
          loginForm.controls.email.touched &&
          loginForm.controls.email.invalid
        "
      >
        Enter a valid email address.
      </small>


      <!-- Password -->
      <label>
        Password
      </label>

      <input
        type="password"
        formControlName="password"
        placeholder="Password"
      />


      <!-- Error Message -->
      <p
        *ngIf="errorMessage"
        class="error"
      >
        {{ errorMessage }}
      </p>


      <!-- Login Button -->
      <button
        type="submit"
        [disabled]="loading"
      >
        {{ loading ? 'Signing in...' : 'Sign in' }}
      </button>

    </form>

  </div>

</div>
